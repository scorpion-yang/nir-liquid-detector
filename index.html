<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#223643">
  <meta name="description" content="MoPod mobile near-infrared sensing application">
  <title>MoPod · V5</title>
  <link rel="stylesheet" href="./styles.css?v=5.0">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button id="back" class="icon-button" aria-label="Back to Home" hidden></button>
      <a class="brand" href="#/home" aria-label="MoPod Home"><svg viewBox="0 0 48 32" aria-hidden="true"><path d="M2 24C10 40 10-12 17 6S20 43 27 16 33-4 37 14 40 30 46 23"/></svg><span>MoPod</span></a>
      <button id="bluetooth" class="icon-button bluetooth" aria-label="Connect Bluetooth device"></button>
      <a id="menu" class="icon-button" href="#/settings" aria-label="Settings"></a>
    </header>
    <main id="content" tabindex="-1"></main>
    <nav id="navigation" class="bottom-navigation" aria-label="Main navigation"></nav>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle">Confirm</h2><p id="confirmMessage"></p><div class="dialog-actions"><button value="cancel" class="button secondary">Cancel</button><button value="confirm" class="button danger">Confirm</button></div></form></dialog>
  <script src="./preprocessing.js?v=5.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.min.js"></script>
  <script type="module" src="./app.js?v=5.0"></script>
</body>
</html>
